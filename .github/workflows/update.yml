name: Update prices and news

on:
  schedule:
    # all times are UTC. IST is UTC + 5:30
    - cron: "30 18 * * 1-5"   # 00:00 IST, full run: prices, history and news
    - cron: "45 3 * * 1-5"    # 09:15 IST, market open, news only
    - cron: "0 7 * * 1-5"     # 12:30 IST, midday, news only
  workflow_dispatch:
    inputs:
      what:
        description: "What to fetch"
        type: choice
        default: everything
        options: [everything, news]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the files are where they should be
        run: |
          echo "Files in this folder:"
          ls -la
          echo "Files in data:"
          ls -la data || echo "THERE IS NO data FOLDER. Create data/watchlist.json in the repository."
          python -c "import json;d=json.load(open('data/watchlist.json'));print('watchlist loaded:',len(d.get('stocks',[])),'stocks,',len(d.get('funds',[])),'funds')"

      - name: Decide what this run does
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "30 18 * * 1-5" ]; then
            echo "args=news" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.what }}" = "news" ]; then
            echo "args=news" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
          echo "Running with: '${{ steps.mode.outputs.args }}'"

      - name: Fetch
        run: python update.py ${{ steps.mode.outputs.args }}

      - name: Save what changed
        run: |
          git config user.name "price bot"
          git config user.email "actions@github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "Nothing changed, so nothing to save."
          else
            git commit -m "Update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Saved."
          fi
