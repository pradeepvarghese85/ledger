name: Update prices and news

on:
  schedule:
    # all times are UTC. IST is UTC + 5:30
    - cron: "30 21 * * 1-5"   # 03:00 IST, full run: NAVs, US close, the screen and news
    - cron: "45 3 * * 1-5"    # 09:15 IST, market open: news and the screen
    - cron: "0 7 * * 1-5"     # 12:30 IST, midday: news and the screen
    - cron: "45 10 * * 1-5"   # 16:15 IST, after the Indian close: prices, news and the screen
  workflow_dispatch:
    inputs:
      what:
        description: "What to fetch"
        type: choice
        default: everything
        options: [everything, live, close, news, prices]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the files are where they should be
        run: |
          echo "Files in this folder:"
          ls -la
          echo "Files in data:"
          ls -la data || echo "THERE IS NO data FOLDER. Create data/watchlist.json in the repository."
          python -c "import json;d=json.load(open('data/watchlist.json'));print('watchlist loaded:',len(d.get('stocks',[])),'stocks,',len(d.get('funds',[])),'funds')"

      - name: Decide what this run does
        id: mode
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            schedule:"45 3 * * 1-5"|schedule:"0 7 * * 1-5") MODE=live ;;
            schedule:"45 10 * * 1-5")                        MODE=close ;;
            schedule:*)                                      MODE= ;;
            *) MODE="${{ github.event.inputs.what }}"; [ "$MODE" = "everything" ] && MODE= ;;
          esac
          echo "args=$MODE" >> "$GITHUB_OUTPUT"
          echo "This run does: ${MODE:-everything}"

      - name: Fetch
        run: python update.py ${{ steps.mode.outputs.args }}

      - name: Save what changed
        run: |
          git config user.name "price bot"
          git config user.email "actions@github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "Nothing changed, so nothing to save."
          else
            git commit -m "Update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Saved."
          fi
