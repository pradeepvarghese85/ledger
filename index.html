<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Ledger</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A personal offline portfolio tracker. It has no accounts, no sign-in and no server: everything is typed in by one person and kept in their own browser.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --paper:#eceef0;--surface:#fff;--ink:#17222c;--soft:#64707b;--rule:#dfe3e7;
 --deep:#1d3c53;--deep2:#2d5b78;--up:#1f6f52;--down:#9b3634;--amber:#8a6212;
 --sh:0 1px 2px rgba(23,34,44,.06);
 --sans:Inter,system-ui,-apple-system,sans-serif;--serif:Spectral,Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0e151b;--surface:#172029;--ink:#e6ebef;--soft:#93a1ac;--rule:#27333d;--deep:#8fc4e3;--deep2:#6ea7c9;--up:#5cc79b;--down:#ef8b84;--amber:#dfb155;--sh:none}}
:root[data-theme="dark"]{--paper:#0e151b;--surface:#172029;--ink:#e6ebef;--soft:#93a1ac;--rule:#27333d;--deep:#8fc4e3;--deep2:#6ea7c9;--up:#5cc79b;--down:#ef8b84;--amber:#dfb155;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh;max-width:1180px;margin:0 auto}
aside{border-right:1px solid var(--rule);padding:22px 14px}
.mark{font:600 19px/1 var(--serif);letter-spacing:.01em;padding:0 10px 18px}
.mark small{display:block;font:400 12px var(--sans);color:var(--soft);margin-top:5px;letter-spacing:0}
aside a{display:block;padding:8px 10px;border-radius:7px;color:var(--soft);text-decoration:none;cursor:pointer;font-size:14.5px}
aside a.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--sh)}
aside a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--deep2);outline-offset:1px}
main{padding:26px 30px 64px;min-width:0}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
h1{font:500 26px/1.2 var(--serif);margin:0}
h2{font:500 17px var(--serif);margin:30px 0 10px}
.lede{color:var(--soft);margin:2px 0 18px;max-width:62ch}
.note{color:var(--soft);font-size:13px;max-width:70ch}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.strip div{background:var(--surface);padding:14px 16px}
.strip span{display:block;color:var(--soft);font-size:12.5px;margin-bottom:3px}
.strip b{font:500 22px var(--serif);display:block}
.strip b.sm{font-size:18px}
.up{color:var(--up)}.down{color:var(--down)}
a{color:var(--deep)}a:hover{text-decoration:none}
ul{margin:0}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--sh)}
.alloc{padding:4px 0}
.alloc .g{display:flex;justify-content:space-between;align-items:baseline;padding:11px 16px 5px;gap:10px}
.alloc .g b{font:500 15px var(--serif)}
.track{height:7px;background:var(--rule);margin:0 16px;border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--deep)}
.subs{display:flex;flex-wrap:wrap;gap:4px 16px;padding:7px 16px 13px;color:var(--soft);font-size:13px;border-bottom:1px solid var(--rule)}
.alloc .g:last-of-type~.subs{border:0}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 16px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-size:12.5px;font-weight:500;color:var(--soft)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border-radius:10px}
.btn{font:500 14px var(--sans);border:1px solid var(--deep);background:var(--deep);color:var(--paper);padding:8px 15px;border-radius:7px;cursor:pointer}
.btn.ghost{background:none;color:var(--deep);border-color:var(--rule)}
.btn.link{background:none;border:0;color:var(--deep);padding:4px 6px;font-size:13.5px}
.btn.danger{color:var(--down)}
.empty{padding:34px 20px;text-align:center}
.empty p{color:var(--soft);margin:0 0 14px}
.drawer{position:fixed;inset:0;background:rgba(10,18,25,.42);display:flex;justify-content:flex-end;z-index:9}
.drawer form{background:var(--surface);width:min(420px,100%);height:100%;overflow:auto;padding:22px 22px calc(28px + env(safe-area-inset-bottom,0px))}
.drawer h3{font:500 19px var(--serif);margin:0 0 16px}
label{display:block;font-size:12.5px;color:var(--soft);margin:12px 0 4px}
input,select,textarea{width:100%;font:15px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:8px 10px}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.acts{display:flex;gap:8px;margin-top:22px}
.flag{border-left:3px solid var(--amber);background:var(--surface);border-radius:0 8px 8px 0;padding:11px 15px;margin:9px 0;font-size:14px}
.err{color:var(--down);font-size:13.5px;margin-top:10px}
.ok{color:var(--up);font-size:13.5px;margin-top:10px}
.pill{font-size:12px;color:var(--soft);border:1px solid var(--rule);border-radius:20px;padding:2px 9px}
.sw{display:flex;align-items:center;gap:7px;color:var(--soft);font-size:13.5px;margin:12px 0}
.sw input{width:auto}
.masked{-webkit-text-security:disc;text-security:disc;font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em}
.drop{border:1px dashed var(--rule);border-radius:10px;padding:18px;background:var(--surface)}
@media (max-width:760px){
 .app{grid-template-columns:1fr}
 aside{border-right:0;border-bottom:1px solid var(--rule);padding:12px;position:sticky;top:0;background:var(--paper);z-index:5;padding-top:calc(12px + env(safe-area-inset-top,0px))}
 .mark{padding:0 4px 10px}.mark small{display:none}
 aside nav{display:flex;gap:4px;overflow-x:auto}
 aside a{white-space:nowrap;padding:7px 11px}
 main{padding:18px 14px 60px}
 th,td{padding:9px 12px}
}
@media (prefers-reduced-motion:no-preference){.drawer form{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(14px);opacity:.7}}}
</style></head>
<body><div class="app">
<aside><div class="mark">Ledger<small>Personal tracker. No sign-in, no accounts, nothing sent anywhere.</small></div><nav id="nav"></nav></aside>
<main id="main"></main></div>
<div id="drawer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ---------- reference lists ---------- */
var CATS=["Stock","Mutual fund","ETF","PPF","EPF","NPS","Gold (physical)","Digital gold","Sovereign gold bond","Fixed deposit","Recurring deposit","Bonds","US stock","China stock","ESOP or RSU","Cash or savings account","Real estate","Other"];
var SUBS=["-","Equity: Large cap","Equity: Mid cap","Equity: Small cap","Equity: Large & Mid cap","Equity: Flexi/Multi cap","Equity: ELSS","Equity: Sectoral/Thematic","Equity: Index/ETF","Equity: International","Equity: Other","Hybrid: Equity-oriented","Hybrid: Other","Debt: Liquid","Debt: Short term","Debt: Long term/Gilt","Debt: Other","Gold fund","Vested","Unvested","Other"];
var MKTS=["India","US","China","Other"],STAT=["Active","Paused","Stopped"],FREQ=["Monthly","Quarterly","Yearly"],FAC={Monthly:1,Quarterly:1/3,Yearly:1/12};
var INCT=["Salary","Business","Rent received","Interest or dividend","Pension","Other"];
var LIAT=["Home loan","Car loan","Personal loan","Education loan","Credit card","Insurance premium","Utility bill","Rent paid","Subscription","Other"];
var LSTAT=["Active","Paused","Closed"];
var KINDS=["Sold shares or ETF","Redeemed mutual fund","Withdrew from PPF, EPF or NPS","Sold gold","Sold another investment","Paid down a loan","Borrowed more"];
var KCAT=[["Stock","ETF","US stock","China stock"],["Mutual fund"],["PPF","EPF","NPS"],["Gold (physical)","Digital gold","Sovereign gold bond"],null];
var isLoan=function(k){return k==KINDS[5]||k==KINDS[6]};

/* ---------- store ---------- */
function blank(){return{inv:[],inc:[],lia:[],tx:[],sips:[],itr:{},plan:{}}}
function load(){try{var r=localStorage.getItem("ledger");if(r){var o=JSON.parse(r);["inv","inc","lia","tx","sips"].forEach(function(k){if(!Array.isArray(o[k]))o[k]=[]});if(!o.itr)o.itr={};if(!o.plan)o.plan={};return o}}catch(e){}return blank()}
var D=load(),page="dash",dr=null,err="",ok="",merge=true,filt="All",sub="All",slab=30,fy=(new Date().getMonth()>=3?new Date().getFullYear():new Date().getFullYear()-1);
function save(){try{localStorage.setItem("ledger",JSON.stringify(D))}catch(e){err="This browser would not save the change. Copy your backup text on the Data tab."}}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function num(x){var n=parseFloat(x);return isFinite(n)?n:0}
function inr(n){n=Math.round(num(n));return(n<0?"-₹":"₹")+Math.abs(n).toLocaleString("en-IN")}
function pct(n){return(n>0?"+":"")+n.toFixed(1)+"%"}
function val(id){var e=document.getElementById(id);return e?e.value.trim():""}
function fyOf(d){var x=new Date(d);return x.getMonth()>=3?x.getFullYear():x.getFullYear()-1}
function fyName(y){return y+"-"+String(y+1).slice(2)}
function guessSub(n){n=(n||"").toLowerCase();var t=[[/liquid|overnight|money market/,"Debt: Liquid"],[/gilt|g-sec|long duration/,"Debt: Long term/Gilt"],[/short duration|low duration|ultra short|corporate bond|banking & psu|credit risk/,"Debt: Short term"],[/gold|silver/,"Gold fund"],[/us equity|nasdaq|international|global|overseas|world|s&p/,"Equity: International"],[/index|nifty|sensex|etf|bharat 22/,"Equity: Index/ETF"],[/elss|tax sav/,"Equity: ELSS"],[/small/,"Equity: Small cap"],[/large\s*(&|and)\s*mid|largemid/,"Equity: Large & Mid cap"],[/\bmid/,"Equity: Mid cap"],[/large cap|bluechip|blue chip|top 100/,"Equity: Large cap"],[/pharma|health|bank|infra|tech|consumption|energy|psu|manufactur|service|sector|thematic/,"Equity: Sectoral/Thematic"],[/flexi|multi|focused|value|contra|dividend yield/,"Equity: Flexi/Multi cap"],[/balanced|hybrid|advantage|asset alloc|arbitrage|equity savings/,"Hybrid: Equity-oriented"],[/bond|income|debt/,"Debt: Other"]];
 for(var i=0;i<t.length;i++)if(t[i][0].test(n))return t[i][1];return"Equity: Other"}
function group(r){var c=r.cat,s=r.sub||"-";
 if(c=="Stock")return["Shares"+(r.mkt&&r.mkt!="India"?" ("+r.mkt+")":" (India)"),"Direct shares"];
 if(c=="US stock")return["Shares (US)","Direct shares"];if(c=="China stock")return["Shares (China)","Direct shares"];
 if(c=="ESOP or RSU")return["Equity compensation",s=="-"?(r.mkt||"Shares"):s];
 if((c=="Mutual fund"||c=="ETF")&&(r.mkt=="US"||r.mkt=="China"))return["Overseas funds and ETFs",r.mkt+(c=="ETF"?" ETF":" fund")];
 if(c=="Mutual fund"||c=="ETF"){if(/^Equity/.test(s))return["Equity funds",s.slice(8)];if(/^Hybrid/.test(s))return["Hybrid funds",s.slice(8)];if(/^Debt/.test(s))return["Debt funds",s.slice(6)];if(s=="Gold fund")return["Gold","Gold fund"];return["Equity funds","Index/ETF"]}
 if(/[Gg]old/.test(c))return["Gold",c];
 if(/^(PPF|EPF|NPS)$/.test(c))return["Retirement and tax-free",c];
 if(c=="Cash or savings account")return["Cash and deposits","Cash"];
 if(/deposit|Bonds/.test(c))return["Cash and deposits",c];
 return["Other",c]}
function totals(){var t={inv:0,val:0,costKnown:0,valKnown:0,owed:0,inM:0,outM:0,emiM:0,sipM:0};
 D.inv.forEach(function(r){t.val+=num(r.value);if(r.invested!==""&&r.invested!=null){t.inv+=num(r.invested);t.valKnown+=num(r.value);t.costKnown+=num(r.invested)}if(r.status=="Active")t.sipM+=num(r.mc)});
 D.inc.forEach(function(r){t.inM+=num(r.amt)*FAC[r.freq]});
 D.lia.forEach(function(r){if(r.status=="Closed")return;t.owed+=num(r.out);var m=num(r.amt)*FAC[r.freq];t.outM+=m;if(/loan|Credit/.test(r.type))t.emiM+=m});
 t.surplus=t.inM-t.outM-t.sipM;t.net=t.val-t.owed;return t}

/* ---------- tax ---------- */
function classify(t){var c=t.cat,s=t.sub||"-",n=(t.name||"").toLowerCase();
 if(/^(PPF|EPF|NPS|Fixed deposit|Recurring deposit)$/.test(c))return"none";
 if(!t.buy||t.cost===""||t.cost==null)return"?";
 var eq=(c=="Stock"&&(!t.mkt||t.mkt=="India"))||(c=="Mutual fund"&&((/^Equity/.test(s)&&s!="Equity: International")||s=="Hybrid: Equity-oriented"))||(c=="ETF"&&(!t.mkt||t.mkt=="India")&&!/gold|silver/.test(n));
 var buy=new Date(t.buy),sold=new Date(t.date),mo=eq?12:24,e=new Date(buy);e.setMonth(e.getMonth()+mo);
 if(c=="Mutual fund"&&/^Debt/.test(s)&&buy>=new Date("2023-04-01"))return"S2";
 var lt=e<sold;return eq?(lt?"L1":"S1"):(lt?"L2":"S2")}
var BUCK={S1:"Short term, shares and equity funds",S2:"Short term, everything else",L1:"Long term, shares and equity funds",L2:"Long term, other assets"},
    BRATE={S1:"20%",S2:"your slab rate",L1:"12.5% above ₹1.25 lakh",L2:"12.5%"};
function taxCalc(rows){var g={S1:0,S2:0,L1:0,L2:0},sale={S1:0,S2:0,L1:0,L2:0},cost={S1:0,S2:0,L1:0,L2:0},miss=0,recd=0;
 rows.forEach(function(t){if(isLoan(t.kind))return;recd+=num(t.proceeds);var b=classify(t);if(b=="none")return;if(b=="?"){miss++;return}
  g[b]+=num(t.proceeds)-num(t.cost);sale[b]+=num(t.proceeds);cost[b]+=num(t.cost)});
 function off(n,from){if(g[n]>=0)return;from.forEach(function(m){if(g[n]>=0)return;var u=Math.min(-g[n],Math.max(g[m],0));g[m]-=u;g[n]+=u})}
 off("S1",["S2","L1","L2"]);off("S2",["S1","L1","L2"]);off("L1",["L2"]);off("L2",["L1"]);
 var free=Math.min(Math.max(g.L1,0),125000),
  tx={S1:Math.max(g.S1,0)*.2,S2:Math.max(g.S2,0)*slab/100,L1:(Math.max(g.L1,0)-free)*.125,L2:Math.max(g.L2,0)*.125};
 return{g:g,sale:sale,cost:cost,free:free,tx:tx,recd:recd,miss:miss,total:(tx.S1+tx.S2+tx.L1+tx.L2)*1.04}}

/* ---------- small renderers ---------- */
function empty(msg,btn,act){return'<div class="panel empty"><p>'+msg+'</p>'+(btn?'<button class="btn" data-go="'+act+'">'+btn+'</button>':"")+'</div>'}
function strip(items){return'<div class="strip">'+items.map(function(i){return'<div><span>'+i[0]+'</span><b class="'+(i[2]||"")+'">'+i[1]+'</b>'+(i[3]?'<span>'+i[3]+'</span>':"")+'</div>'}).join("")+'</div>'}
function rows(head,body,note){return'<div class="panel tw"><table><tr>'+head+'</tr>'+body+'</table></div>'+(note?'<p class="note">'+note+'</p>':"")}

/* ---------- pages ---------- */
function dash(){var t=totals();
 if(!D.inv.length&&!D.inc.length&&!D.lia.length)
  return'<h1>Dashboard</h1><p class="lede">Nothing is stored yet. Bring your holdings in from a statement, or type them in one at a time. Everything stays in this browser.</p>'+
   '<div class="panel empty"><p>Start with a CAS statement, a broker file, or a single entry.</p><button class="btn" data-go="data">Import a file</button> <button class="btn ghost" data-dr="inv">Add a holding</button></div>';
 var h='<h1>Dashboard</h1><p class="lede">Where you stand today.</p>'+priceLine()+strip([
  ["Net worth",inr(t.net),"","investments less what you owe"],
  ["Investments",inr(t.val),"",D.inv.length+" holdings"],
  ["Owed on loans",inr(t.owed),t.owed?"down":""],
  ["Gain where cost is known",t.costKnown?pct((t.valKnown/t.costKnown-1)*100):"-",t.valKnown>=t.costKnown?"up":"down",t.costKnown?inr(t.valKnown-t.costKnown):""],
  ["Spare each month",inr(t.surplus),t.surplus>=0?"up":"down","after bills and investing"]]);
 var G={},tv=0;D.inv.forEach(function(r){var a=group(r),v=num(r.value);tv+=v;G[a[0]]=G[a[0]]||{t:0,s:{}};G[a[0]].t+=v;G[a[0]].s[a[1]]=(G[a[0]].s[a[1]]||0)+v});
 if(tv>0){h+='<h2>How your money is spread</h2><div class="panel alloc">';
  Object.keys(G).sort(function(a,b){return G[b].t-G[a].t}).forEach(function(k){var p=G[k].t/tv*100;
   h+='<div class="g"><b>'+esc(k)+'</b><span>'+inr(G[k].t)+' · '+p.toFixed(1)+'%</span></div><div class="track"><i style="width:'+p.toFixed(2)+'%"></i></div><div class="subs">'+
   Object.keys(G[k].s).sort(function(a,b){return G[k].s[b]-G[k].s[a]}).map(function(s){return "<span>"+esc(s)+" "+inr(G[k].s[s])+"</span>"}).join("")+'</div>'});
  h+='</div>'}
 if(t.inM&&t.emiM/t.inM>.4)h+='<div class="flag">Loan and card payments take '+(t.emiM/t.inM*100).toFixed(0)+'% of your income. Many lenders treat anything above 40% as stretched.</div>';
 if(t.inM&&t.surplus<0)h+='<div class="flag">Your bills and investing come to '+inr(-t.surplus)+' more than your income each month.</div>';
 if(!D.inc.length)h+='<div class="flag">Add your income and bills to see what you can spare each month. <button class="btn link" data-go="cash">Go to Income and bills</button></div>';
 return h}

function portfolio(){
 var h='<div class="head"><h1>Portfolio</h1><button class="btn" data-dr="inv">Add a holding</button></div><p class="lede">Shares, funds, gold, deposits and retirement savings.</p>';
 if(!D.inv.length)return h+empty("No holdings yet. Import a statement on the Data tab, or add one by hand.","Import a file","data");
 var groups=[],subs=[];
 D.inv.forEach(function(r){var g=group(r);if(groups.indexOf(g[0])<0)groups.push(g[0]);if(g[0]==filt&&subs.indexOf(g[1])<0)subs.push(g[1])});
 groups.sort();subs.sort();
 if(filt!="All"&&groups.indexOf(filt)<0){filt="All";sub="All"}
 if(sub!="All"&&subs.indexOf(sub)<0)sub="All";
 var keep=function(r){var g=group(r);return(filt=="All"||g[0]==filt)&&(sub=="All"||g[1]==sub)};
 var shown=D.inv.filter(keep),shownV=shown.reduce(function(a,r){return a+num(r.value)},0),
  allV=D.inv.reduce(function(a,r){return a+num(r.value)},0);
 h+=priceLine();
 h+='<div class="panel" style="padding:12px 16px;display:flex;gap:18px;flex-wrap:wrap;align-items:end"><div><label for="filt">Asset class</label><select id="filt"><option>All</option>'+groups.map(function(g){return'<option'+(g==filt?" selected":"")+'>'+esc(g)+'</option>'}).join("")+'</select></div>'+
  (filt!="All"&&subs.length>1?'<div><label for="sub">Within it</label><select id="sub"><option>All</option>'+subs.map(function(x){return'<option'+(x==sub?" selected":"")+'>'+esc(x)+'</option>'}).join("")+'</select></div>':"")+
  '<div><label>Showing</label><b style="font:500 17px var(--serif)">'+shown.length+' of '+D.inv.length+' · '+inr(shownV)+(allV&&filt!="All"?' · '+(shownV/allV*100).toFixed(1)+'% of everything':"")+'</b></div></div>';
 h+='<label class="sw"><input type="checkbox" id="merge"'+(merge?" checked":"")+'> Combine the same holding across brokers and folios</label>';
 if(merge){var M={},o=[];shown.forEach(function(r){var k=r.cat+"|"+(r.name||"").toLowerCase().replace(/\b(limited|ltd)\b/g,"").replace(/[^a-z0-9]/g,"");
   if(!M[k]){M[k]={r:r,pl:[],q:0,i:0,v:0,part:false};o.push(M[k])}var m=M[k];if(r.plat&&m.pl.indexOf(r.plat)<0)m.pl.push(r.plat);
   m.q+=num(r.qty);m.v+=num(r.value);if(r.invested===""||r.invested==null)m.part=true;else m.i+=num(r.invested)});
  var tv=o.reduce(function(a,m){return a+m.v},0);
  h+=rows('<th>Holding</th><th>Type</th><th>Fund type</th><th>Held in</th><th class="n">Units</th><th class="n">Put in</th><th class="n">Value</th><th class="n">Share</th>',

  AN.forEach(function(a){if(a<y-.5&&(a+y)/2>lo)lo=(a+y)/2;if(a>y+.5&&(a+y)/2<hi)hi=(a+y)/2});
  for(var k=0;k<L.length;k++){if(L[k].y<=lo||L[k].y>hi)continue;L[k].it.forEach(function(z){if(z.x>=xl&&z.r<=xr+1&&!ISIN.test(z.s))t.push(z)})}
  t.sort(function(a,b){return Math.round(a.y/3)-Math.round(b.y/3)||a.x-b.x});return t.map(function(z){return z.s}).join(" ").replace(/\s+/g," ").trim()}

  if(w===0||w===6){why=why||"weekend";x.setDate(x.getDate()+1);n++;continue}

function navOn(code,isoDate){if(!PXm||!PXm.history||!PXm.history[code])return null;
 var H=PXm.history[code],ks=Object.keys(H).sort(),best=null;
 for(var i=0;i<ks.length;i++){if(ks[i]<=isoDate)best=ks[i];else break}
 if(!best)return null;
 var gap=Math.round((new Date(isoDate)-new Date(best))/864e5);
 return{price:H[best],date:best,gap:gap,exact:gap===0}}
function dueSips(){var out=[],today=new Date();today.setHours(0,0,0,0);
 D.inv.forEach(function(r,i){if(!(num(r.mc)>0)||r.status!="Active"||!num(r.day))return;
  var from=r.lastSip?new Date(r.lastSip):new Date(today.getTime()-45*864e5),
   d=new Date(from.getFullYear(),from.getMonth(),1),n=0;
  while(n<15&&d<=today){var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),
   planned=new Date(d.getFullYear(),d.getMonth(),Math.min(num(r.day),last)),sh=shift(planned,mkt(r));
   if(sh.date<=today&&(!r.lastSip||iso(sh.date)>r.lastSip))out.push({i:i,r:r,date:sh.date,iso:iso(sh.date),moved:sh.moved,why:sh.why});
   d=new Date(d.getFullYear(),d.getMonth()+1,1);n++}});
 out.sort(function(a,b){return a.date-b.date});return out}
function confirmSip(k,skip){var due=dueSips(),x=due[k];if(!x)return;
 var r=D.inv[x.i],amt=num(val("sa"+k))||num(r.mc),nav=num(val("sn"+k)),when=val("sd"+k)||x.iso;
 if(when<x.iso)when=x.iso;
 if(!skip){
  if(!(nav>0)){err="No price for "+x.iso+", so type the NAV or price you were given.";render();return}
  var units=Math.round(amt/nav*1e4)/1e4;
  r.qty=Math.round((num(r.qty)+units)*1e4)/1e4;
  if(r.invested!==""&&r.invested!=null)r.invested=Math.round((num(r.invested)+amt)*100)/100;
  r.value=Math.round(num(r.qty)*nav*100)/100;
  D.sips.push({name:r.name,code:r.code||"",date:when,amount:amt,nav:nav,units:units});
  ok="Added "+units+" units of "+r.name+" at "+nav+" on "+when+"."}
 else ok="Marked "+r.name+" as not taken on "+when+".";
 r.lastSip=when;err="";save();render()}
var sipDate={};
function sipDue(){var due=dueSips();if(!due.length)return"";
 var h='<h2>Instalments to confirm</h2><p class="note">The dashboard cannot see your actual purchases, so it works the units out from the amount and the price on the day. Change the date if your statement shows a different one, check the amount, then confirm. A price is filled in only when it belongs to that exact day, so a day whose NAV is not out yet waits for the next update. If an instalment did not go through, press Not taken.</p>';
 h+='<div class="panel tw"><table><tr><th>Date</th><th>Holding</th><th>Amount</th><th>Price used</th><th class="n">Units</th><th></th></tr>';
 due.forEach(function(x,k){var when=sipDate[x.r.name+"|"+x.iso]||x.iso,
  p=x.r.code?navOn(x.r.code,when):null,nav=(p&&p.exact)?p.price:"",
  amt=num(x.r.mc),u=nav?Math.round(amt/nav*1e4)/1e4:"",note;
  if(p&&p.exact)note='<span class="note">price of '+esc(p.date)+'</span>';

  h+='<tr><td><input type="date" id="sd'+k+'" value="'+esc(when)+'" style="width:152px">'+(x.moved?'<br><span class="note">due the '+x.date.getDate()+", "+esc(x.why)+'</span>':"")+'</td><td>'+esc(x.r.name)+'</td>'+
   '<td><input id="sa'+k+'" type="number" step="any" value="'+esc(x.r.mc)+'" style="width:110px"></td>'+
   '<td><input id="sn'+k+'" type="number" step="any" value="'+esc(nav)+'" style="width:120px"><br>'+note+'</td>'+
   '<td class="n">'+(u||"-")+'</td><td><button class="btn" data-sip="'+k+'">Confirm</button> <button class="btn link" data-skip="'+k+'">Not taken</button></td></tr>'});
 return h+'</table></div>'}
function sipLog(){var L=(D.sips||[]).slice().reverse();if(!L.length)return"";
 return'<h2>Confirmed instalments</h2>'+rows('<th>Date</th><th>Holding</th><th class="n">Amount</th><th class="n">Price</th><th class="n">Units</th><th></th>',
  L.map(function(x,k){return'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.name)+'</td><td class="n">'+inr(x.amount)+'</td><td class="n">'+x.nav+'</td><td class="n">'+x.units+'</td><td><button class="btn link danger" data-unsip="'+(D.sips.length-1-k)+'">Undo</button></td></tr>'}).join(""),
  "Undo takes back the units and the cost it added.")}
function undoSip(i){var x=D.sips[i];if(!x)return;
 D.inv.forEach(function(r){if(r.name!=x.name)return;
  r.qty=Math.round(Math.max(0,num(r.qty)-num(x.units))*1e4)/1e4;
  if(r.invested!==""&&r.invested!=null)r.invested=Math.round(Math.max(0,num(r.invested)-num(x.amount))*100)/100;
  r.value=Math.round(num(r.qty)*num(x.nav)*100)/100;
  var earlier=D.sips.filter(function(y,j){return y.name==x.name&&j!=i}).map(function(y){return y.date}).sort();
  r.lastSip=earlier.length?earlier[earlier.length-1]:""});
 D.sips.splice(i,1);ok="Undone.";save();render()}

function liquid(){var t=0;D.inv.forEach(function(r){var c=r.cat,s=r.sub||"";
 if(c=="Cash or savings account"||c=="Fixed deposit"||c=="Recurring deposit"||s=="Debt: Liquid")t+=num(r.value)});return t}
function plan(){var P=D.plan||{},t=totals(),
 people=Math.max(1,num(P.people)||1),months=Math.max(1,num(P.months)||6),
 essentials=t.outM,cash=liquid(),
 floorMonths=P.floor===0?0:(num(P.floor)||6),floorAmt=essentials*floorMonths,
 cover=essentials>0?cash/essentials:(cash>0?99:0),
 spare=Math.max(0,cash-floorAmt),
 saved=Math.max(0,t.surplus)*months,
 raw=spare*0.5+saved*0.7,blocks=[];
 if(!t.inM)blocks.push("No income entered yet.");
 else{
  if(t.surplus<=0)blocks.push("Nothing is left over each month, so a trip would come out of savings or onto a card.");
  if(t.emiM/t.inM>0.4)blocks.push("Loan and card payments take "+(t.emiM/t.inM*100).toFixed(0)+"% of your income. Steady that before adding a holiday.");
  if(essentials>0&&cover<3)blocks.push("Your cash would cover "+cover.toFixed(1)+" months of bills. Build that to three first.");
 }
 var budget=blocks.length?0:Math.round(raw),
  list=(P.trips&&P.trips.length)?P.trips:TRIPS,afford=null,next=null;
 list.forEach(function(x){var cost=num(x.per)*people;
  if(cost<=budget){if(!afford||num(x.per)>num(afford.per))afford=x}
  else if(!next||num(x.per)<num(next.per))next=x});
 return{t:t,cash:cash,cover:cover,floorAmt:floorAmt,spare:spare,saved:saved,budget:budget,
  per:budget/people,people:people,months:months,floorMonths:floorMonths,
  blocks:blocks,afford:afford,next:next,list:list}}
function planView(){var p=plan();
 var h='<h2>What you can afford</h2><p class="note">Not a goal tracker. It asks what you could spend on something enjoyable without denting your position, using what is left each month and any cash above an emergency cushion.</p>';
 h+='<div class="panel" style="padding:12px 16px;display:flex;gap:18px;flex-wrap:wrap;align-items:end">'+
  '<div><label for="p_people">People travelling</label><input type="number" min="1" step="1" id="p_people" value="'+esc(p.people)+'" style="width:90px"></div>'+

 if(p.blocks.length)return h+'<div class="flag"><b>Nothing comfortable yet.</b><br>'+p.blocks.map(esc).join("<br>")+'</div>'+
  '<p class="note">Fill in your income and bills above, and add your savings account or liquid fund as a holding so the cushion can be counted.</p>';
 h+=strip([["Comfortable budget",inr(p.budget),"up",p.people>1?inr(p.per)+" each":""],
  ["From "+p.months+" months of saving",inr(p.saved*0.7)],
  ["From cash above the cushion",inr(p.spare*0.5)],

 if(p.afford)h+='<div class="panel" style="padding:16px;margin-top:10px"><div style="font:500 20px var(--serif)">'+esc(p.afford.name)+'</div><p class="note" style="margin:4px 0 0">'+esc(p.afford.note||"")+' · about '+inr(num(p.afford.per)*p.people)+' for '+p.people+(p.people>1?" people":" person")+'</p></div>';
 else h+='<div class="flag">A budget of '+inr(p.budget)+' is below the cheapest trip on the list. Save for longer, or lower a cost below.</div>';
 if(p.next){var gap=num(p.next.per)*p.people-p.budget,perMonth=Math.ceil(gap/(0.7*p.months)/100)*100;
  h+='<p class="note">The next rung is '+esc(p.next.name)+' at about '+inr(num(p.next.per)*p.people)+'. That needs '+inr(gap)+' more, which is roughly '+inr(perMonth)+' a month more for '+p.months+' months, or a few months longer at your present rate.</p>'}
 h+='<h3 style="font:500 15px var(--serif);margin:20px 0 6px">The ladder</h3>';
 h+=rows('<th>Where</th><th class="n">Cost each</th><th class="n">For '+p.people+'</th><th>Within budget</th><th></th>',
  p.list.map(function(x,i){var cost=num(x.per)*p.people;
   return'<tr><td>'+esc(x.name)+'<br><span class="note">'+esc(x.note||"")+'</span></td><td class="n"><input type="number" step="any" id="tp'+i+'" value="'+esc(x.per)+'" style="width:110px"></td><td class="n">'+inr(cost)+'</td><td>'+(cost<=p.budget?'<span class="up">yes</span>':'<span class="note">'+inr(cost-p.budget)+' short</span>')+'</td><td><button class="btn link danger" data-trip="'+i+'">Remove</button></td></tr>'}).join(""),

 return h}


/* ---------- sell and hold signals ---------- */
function moveOver(code,days){if(!code||!PXm||!PXm.history||!PXm.history[code])return null;
 var H=PXm.history[code],ks=Object.keys(H).sort();if(ks.length<2)return null;
 var last=ks[ks.length-1],want=iso(new Date(new Date(last)-days*864e5)),base=null;
 for(var i=0;i<ks.length;i++){if(ks[i]<=want)base=ks[i];else break}
 if(!base||base==last)return null;
 var gap=Math.round((new Date(want)-new Date(base))/864e5);
 if(gap>20)return null;
 return{pct:(H[last]/H[base]-1)*100,from:base,to:last}}
function freeLtcgLeft(){var used=0;
 D.tx.forEach(function(t){if(isLoan(t.kind)||!t.date||fyOf(t.date)!=fy)return;
  if(classify(t)=="L1")used+=Math.max(0,num(t.proceeds)-num(t.cost))});
 return{used:Math.min(used,125000),left:Math.max(0,125000-used)}}
function signals(){
 var tot=D.inv.reduce(function(a,r){return a+num(r.value)},0),out=[],subCount={},catTot={};
 D.inv.forEach(function(r){var g=group(r);catTot[g[0]]=(catTot[g[0]]||0)+num(r.value);
  if(r.cat=="Mutual fund"||r.cat=="ETF"){subCount[r.sub]=(subCount[r.sub]||0);subCount[r.sub]++}});
 D.inv.forEach(function(r,i){
  var v=num(r.value),w=tot?v/tot*100:0,
   cost=(r.invested===""||r.invested==null)?null:num(r.invested),
   gain=(cost&&cost>0)?(v/cost-1)*100:null,
   m1=moveOver(r.code,30),m3=moveOver(r.code,92),
   locked=r.mat&&new Date(r.mat)>new Date(),
   bull=[],bear=[],score=0,flags=[];
  if(v<=0)return;
  if(w>10){score+=2;flags.push("large position");
   bear.push("It is "+w.toFixed(1)+"% of everything you hold, so one bad year here moves your whole portfolio.");
   bull.push("A concentrated position is what produces a large gain in the first place, and trimming a good holding has its own cost.")}
  if(gain!==null&&gain>100&&w>1.5){score+=2;flags.push("big winner");
   bull.push("Up "+gain.toFixed(0)+"% on your cost, and a trend that has worked has often kept working.");
   bear.push("Selling part turns some of that into money you actually have, and your original capital is already back several times over.")}
  if(gain!==null&&gain<-30){score+=2;flags.push("well down");
   bull.push("Down "+Math.abs(gain).toFixed(0)+"%, and selling now makes a paper loss real. Recoveries do happen.");
   bear.push("The loss can be set against other gains this year, and the money could work harder somewhere you still believe in.")}
  if(m3&&m3.pct<-20){score+=1;flags.push("falling");
   bear.push("Down "+Math.abs(m3.pct).toFixed(0)+"% over roughly three months, which is worth a reason rather than a shrug.");
   bull.push("A fall of that size in a holding you bought for the long run is not by itself a reason to sell.")}
  if(m3&&m3.pct>40){score+=1;flags.push("sharp run");
   bull.push("Up "+m3.pct.toFixed(0)+"% in about three months.");
   bear.push("A run that fast usually gives some back. Taking a part off the table costs nothing but the upside you forgo.")}
  if(v<10000&&w<1&&r.cat!="NPS"){score+=1;flags.push("very small");
   bull.push("It costs nothing to keep and might still come good.");
   bear.push("At "+inr(v)+" it cannot change your results, but it takes your attention at tax time.")}
  if(r.status!="Active"&&v>0&&num(r.mc)===0){score+=1;flags.push("dormant");
   bull.push("Leaving it invested keeps the money in the market.");
   bear.push("Nothing is going in any more, so decide whether you would buy it today. If not, the money has a better home.")}
  if((r.cat=="Mutual fund")&&subCount[r.sub]>2){score+=1;flags.push("crowded category");
   bull.push("Different managers in the same category do behave differently.");
   bear.push("You hold "+subCount[r.sub]+" funds in "+esc(r.sub)+". They are likely to own many of the same companies, so you carry the fees without the spread.")}
  if(locked){flags.push("locked in");
   bull.push("Locked until "+esc(r.mat)+", so this one is not a decision you can act on yet.")}
  if(cost===null){flags.push("no cost on file");
   bear.push("No purchase cost is recorded, so neither the gain nor the tax can be judged. Add it before deciding anything.")}
  if(r.code&&PXm&&!PX[r.code])flags.push("no live price");
  if(!flags.length)return;
  var verdict=locked?"Cannot act yet":score>=4?"Worth a decision":score>=2?"Review":"Keep an eye on it";
  out.push({r:r,i:i,w:w,v:v,gain:gain,m1:m1,m3:m3,score:score,flags:flags,bull:bull,bear:bear,verdict:verdict})});
 out.sort(function(a,b){return b.score-a.score||b.v-a.v});
 return{list:out,tot:tot,catTot:catTot}}

 if(tot&&eq/tot>0.85)h+='<div class="flag">About '+(eq/tot*100).toFixed(0)+'% of your money is in equity. That is fine while you do not need it, but it means a bad year hits nearly everything at once. Cash, deposits or a debt fund would soften that, at the cost of some return.</div>';
 if(F.left>20000)h+='<div class="flag">'+inr(F.left)+' of long-term equity gain can still be realised tax free this financial year. Selling and buying back the same amount resets your cost at no tax cost, though it restarts the holding clock and costs you the exit load if any.</div>';
 if(!L.length)return h+'<p>No holding triggers a rule today.</p>';
 L.forEach(function(x){
  h+='<div class="panel" style="padding:16px;margin:10px 0"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline">'+

 h+='<div class="tw"><table><tr><th>Use</th><th>Scheme</th><th class="n">Units now</th><th class="n">Cost</th><th class="n">Value</th><th>Bought</th><th>Sold</th><th>In your list</th></tr>';

 h+='</table></div>';

  h+='<div class="tw"><table><tr><th>Use</th><th>Date</th><th>Scheme</th><th class="n">Units</th><th class="n">Received</th><th class="n">What it cost you</th><th>Bought on</th></tr>';
  sales.forEach(function(q,k){

  h+='</table></div>'}
 h+='<div class="acts"><button class="btn" data-dcas="apply">Bring these in</button></div>'+
  '<p class="note">Units, cost and value are taken from the statement and replace what you have, because the statement is the authority. Nothing is doubled up: purchases are not added again, and sales do not reduce anything.</p></div>';

function dcApply(){var added=0,updated=0,sales=0,closed=0,wl=[];
 DC.schemes.forEach(function(s,i){var e=document.getElementById("dk"+i);if(!e||!e.checked)return;
  var m=dcMatch(s);
  if(s.closing!==null&&s.closing<=0){
   if(m){m.r.qty=0;m.r.value=0;m.r.invested=0;m.r.status="Stopped";m.r.mc="";m.r.note=(m.r.note?m.r.note+"; ":"")+"exited, from the CAS";closed++}
   return}
  if(m){var r=m.r;
   if(s.closing!=null)r.qty=s.closing;
   if(s.cost!=null)r.invested=s.cost;
   if(s.value!=null)r.value=s.value;
   if(s.tx.length&&!r.day){var last=s.bought[s.bought.length-1];if(last){r.day=+last.date.slice(8,10);r.mc=Math.abs(last.amount)}}
   var lastBuy=s.bought.length?s.bought[s.bought.length-1].date:"";
   if(lastBuy&&(!r.lastSip||r.lastSip<lastBuy))r.lastSip=lastBuy;
   updated++}
  else{D.inv.push({name:s.name,cat:"Mutual fund",sub:guessSub(s.name),plat:s.demat?"Demat":("Folio "+s.folio),
    mkt:"India",code:"",qty:s.closing,invested:s.cost==null?"":s.cost,value:s.value==null?0:s.value,
    mc:"",day:"",rate:"",status:"Active",mat:"",note:"From the detailed CAS, ISIN "+s.isin,
    lastSip:s.bought.length?s.bought[s.bought.length-1].date:""});
   added++;wl.push({code:"MF:"+s.isin.slice(-6),isin:s.isin,name:s.name})}});
 var k=0;
 DC.schemes.forEach(function(s,i){s.sold.forEach(function(x){
  var e=document.getElementById("ds"+k),cost=val("dsc"+k),buy=val("dsb"+k);k++;
  if(!e||!e.checked)return;
  D.tx.push({kind:KINDS[1],item:s.name,plat:s.demat?"Demat":("Folio "+s.folio),cat:"Mutual fund",sub:guessSub(s.name),
   mkt:"India",date:x.date,units:String(Math.abs(x.units)),proceeds:Math.abs(x.amount),
   cost:cost===""?"":num(cost),buy:buy,note:"From the detailed CAS",taxOnly:true,
   closed:(s.closing!==null&&s.closing<=0)});
  sales++})});
 save();DC=null;dcFile=null;dcName="";
 ok="Brought in: "+updated+" holdings updated, "+added+" added, "+closed+" marked as exited, "+sales+" sales recorded."+
  (wl.length?" Add these to watchlist.json so the new ones get prices: "+wl.map(function(x){return x.name+" ("+x.isin+")"}).join(", ")+".":"");
 render()}

/* ---------- check-up ---------- */
function ageDays(d){if(!d)return null;var m=String(d).match(/(\d{2})-(\d{2}|[A-Za-z]{3})-(\d{4})/);if(!m)return null;
 var mo={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11}[String(m[2]).toLowerCase().slice(0,3)];
 var x=new Date(+m[3],isNaN(mo)?(+m[2]-1):mo,+m[1]);return Math.round((new Date()-x)/864e5)}
function qc(){var P=[],W=[],I=[],inv=D.inv,tot=inv.reduce(function(a,r){return a+num(r.value)},0);
 var feedable={"Stock":1,"ETF":1,"Mutual fund":1,"US stock":1,"China stock":1};
 var nocode=[],badcode=[],nocost=[],stale7=[],dup={},dupes=[],nosub=[],mktodd=[],zero=[],sipodd=[],big=[],foreign=[],lock=[];
 inv.forEach(function(r){
  var q=num(r.qty),v=num(r.value),key=(r.name||"").toLowerCase().trim()+"|"+(r.plat||"").toLowerCase().trim();
  if(dup[key])dupes.push(r.name+" in "+(r.plat||"no platform"));else dup[key]=1;
  if(feedable[r.cat]&&q>0&&!r.code)nocode.push(r.name);
  if(r.code&&PXm&&PX&&!PX[r.code])badcode.push(r.name+" ("+r.code+")");
  if(v>0&&(r.invested===""||r.invested==null||num(r.invested)===0))nocost.push(r.name);
  var a=r.live?ageDays(r.live):null;if(a!==null&&a>7)stale7.push(r.name+", "+a+" days");
  if((r.cat=="Mutual fund"||r.cat=="ETF")&&(!r.sub||r.sub=="-"))nosub.push(r.name);
  if(r.code&&r.mkt=="India"&&!/\.(NS|BO)$/.test(r.code)&&r.code.indexOf("MF:")!==0)mktodd.push(r.name+" is marked India but its code is "+r.code);
  if(r.code&&(r.mkt=="US"||r.mkt=="China")&&/\.(NS|BO)$/.test(r.code))mktodd.push(r.name+" is marked "+r.mkt+" but its code is an Indian one");
  if(q===0&&v===0&&r.status=="Active")zero.push(r.name);
  if(num(r.mc)>0&&r.status!="Active")sipodd.push(r.name+" has a monthly amount but is "+(r.status||"blank").toLowerCase());
  if(num(r.mc)>0&&!num(r.day))sipodd.push(r.name+" has a monthly amount but no day of the month");
  if(tot&&v/tot>0.1)big.push(r.name+", "+(v/tot*100).toFixed(1)+"%");
  if(r.mkt=="US"||r.mkt=="China"||r.cat=="US stock"||r.cat=="China stock"||r.cat=="ESOP or RSU")foreign.push(r.name);
  if(r.mat&&new Date(r.mat)>new Date())lock.push(r.name+" until "+r.mat)});
 var txbad=D.tx.filter(function(t){return!isLoan(t.kind)&&classify(t)=="?"}).map(function(t){return t.item+" on "+t.date});
 function add(a,list,head,tail){if(list.length)a.push(head+" "+few(list,8)+(tail?". "+tail:"."))}
 add(P,nocode,"No price feed code, so these are not updated automatically:","Add the code in the watchlist and on the holding.");
 add(P,badcode,"Feed code not found in the last price file:","Either the code is wrong or the watchlist does not have it.");
 add(P,txbad,"Sales missing a buy date or cost, so they are left out of the tax figures:","");
 add(P,mktodd,"Market and feed code disagree:","A wrong market changes the tax treatment.");
 add(W,nocost,"No cost recorded, so no gain and no tax can be worked out:","");
 add(W,stale7,"Price older than a week:","");
 add(W,dupes,"The same name appears twice in the same place:","Check this is not a double entry.");
 add(W,nosub,"Fund with no fund type, so it cannot be grouped:","");
 add(W,sipodd,"Monthly investment set up oddly:","");
 add(W,zero,"Nothing left but still marked active:","Mark it stopped, or delete it.");
 add(W,big,"More than a tenth of everything sits in one holding:","");
 if(HOL){var ends=[];D.inv.forEach(function(r){if(num(r.mc)>0&&r.status=="Active"){var m=mkt(r),e=calBounds(m);if(e&&ends.indexOf(m+" to "+e)<0&&new Date(e)<new Date(Date.now()+90*864e5))ends.push(m+" to "+e)}});
  if(ends.length)W.push("Holiday calendar nearly used up: "+few(ends,4)+". SIP dates past that only skip weekends.")}
 var sameDay={};D.tx.forEach(function(t){if(isLoan(t.kind)||t.taxOnly||t.closed)return;
  var key=(t.item||"")+"|"+(t.date||"");if(sameDay[key])W.push("Two sales of "+t.item+" recorded on "+t.date+". Check this is not the same one entered twice.");sameDay[key]=1});
 var dueN=dueSips().length;
 if(dueN)W.push(dueN+" monthly instalment(s) are past their date and not confirmed, so units and cost are behind. The SIP calendar lists them.");
 if(!D.inc.length)W.push("No income entered, so the spare-each-month figure cannot be worked out.");
 if(!D.lia.length)W.push("No loans or bills entered, so net worth counts no debt.");
 if(fxMiss.length)P.push("No exchange rate for "+few(fxMiss,4)+", so foreign holdings are not converted.");
 if(PXm&&PXm.stale&&PXm.stale.length)W.push("The last price run could not fetch "+PXm.stale.length+" of them: "+few(PXm.stale,8)+".");
 add(I,foreign,"Held outside India, so Schedule FA of ITR-2 applies:","");
 add(I,lock,"Locked in or maturing later:","");
 if(PXm&&PXm.prices){var byname=Object.keys(PXm.prices).filter(function(k){return(PXm.prices[k].how||"").indexOf("name")>-1});
  if(byname.length)W.push("Matched by name rather than ISIN, so worth checking once: "+few(byname.map(function(k){return PXm.prices[k].name||k}),6)+".")}
 return{P:P,W:W,I:I,tot:tot}}
function checkup(){var r=qc();
 var h='<h1>Check-up</h1><p class="lede">Everything the dashboard can test about your own entries. It runs on what is in this browser; nothing is sent anywhere.</p>';
 h+=strip([["Holdings",String(D.inv.length)],["Priced automatically",String(D.inv.filter(function(x){return x.live}).length)],["Needs attention",String(r.P.length),r.P.length?"down":"up"],["Worth a look",String(r.W.length)]]);
 function block(t,list,cls){if(!list.length)return'<h2>'+t+'</h2><p class="note">Nothing here.</p>';
  return'<h2>'+t+'</h2>'+list.map(function(x){return'<div class="flag"'+(cls?' style="border-left-color:var(--'+cls+')"':"")+'>'+esc(x)+'</div>'}).join("")}

 h+='<h2>Things the dashboard cannot check</h2><p class="note">That your units and costs match your broker and CAS. That a price belongs to the right scheme, beyond the ISIN test. That your income and bills are complete and current. Any holding you have not entered at all.</p>';

function render(){
 if(PXm)applyPrices();
 document.getElementById("nav").innerHTML=PAGES.map(function(p){return'<a tabindex="0" class="'+(page==p[0]?"on":"")+'" data-go="'+p[0]+'">'+p[1]+'</a>'}).join("");
 var body=PAGES.filter(function(p){return p[0]==page})[0][2]();
 if(ok)body+='<p class="ok">'+esc(ok)+'</p>';
 if(err&&!dr)body+='<p class="err">'+esc(err)+'</p>';
 document.getElementById("main").innerHTML=body;
 document.getElementById("drawer").innerHTML=drawer();
 var first=document.querySelector(".drawer input,.drawer select");if(first)first.focus()}
document.addEventListener("click",function(ev){var t=ev.target,g=function(a){return t.getAttribute&&t.getAttribute(a)};
 if(g("data-go")){var v=g("data-go");if(v.indexOf("dr:")===0){dr={k:v.slice(3),i:-1}}else{page=v}err="";ok="";render();return}
 if(g("data-dr")){dr={k:g("data-dr"),i:g("data-i")==null?-1:+g("data-i")};err="";ok="";render();return}
 if(g("data-close")||t.className=="drawer"){dr=null;err="";render();return}
 if(g("data-save")){saveForm();return}
 if(g("data-preset")){var pv=g("data-preset");
  if(pv=="x")sF={theme:"All",metric:"y1",dir:"more",val:"",off:"Any",vol:"Any",own:"All",sort:"y1",q:"",note:""};
  else{var P=PRESETS[+pv];sF={theme:sF.theme,metric:"y1",dir:"more",val:"",off:"Any",vol:"Any",own:sF.own,sort:"y1",q:"",note:P[1]};
   Object.keys(P[2]).forEach(function(k){sF[k]=P[2][k]})}
  render();return}
 if(g("data-trip")){var L=(D.plan.trips||TRIPS).slice();L.splice(+g("data-trip"),1);D.plan.trips=L;save();render();return}
 if(g("data-addtrip")){var L2=(D.plan.trips||TRIPS).slice();L2.push({name:"New destination",per:50000,note:""});D.plan.trips=L2;save();render();return}
 if(g("data-resettrip")){delete D.plan.trips;save();render();return}
 if(g("data-sip")){confirmSip(+g("data-sip"),false);return}
 if(g("data-skip")){confirmSip(+g("data-skip"),true);return}
 if(g("data-unsip")){undoSip(+g("data-unsip"));return}
 if(g("data-savetx")){saveTx();return}
 if(g("data-del")){var p=g("data-del").split("|");D[p[0]].splice(+p[1],1);save();render();return}
 if(g("data-dcas")=="read"){readDetailed();return}
 if(g("data-dcas")=="apply"){dcApply();return}
 if(g("data-cas")=="read"){readCas();return}
 if(g("data-cas")=="add"){casAdd();return}
 if(g("data-sheet")=="add"){sheetAdd();return}
 if(g("data-fill")){var m={sal:0,hp:0,int:0};
  D.inc.forEach(function(r){var y=num(r.amt)*FAC[r.freq]*12;if(r.type=="Salary")m.sal+=y;else if(r.type=="Rent received")m.hp+=y;else if(r.type=="Interest or dividend")m.int+=y});
  D.itr.sal=Math.round(m.sal);D.itr.hp=Math.round(m.hp);D.itr.int=Math.round(m.int);save();ok="Income copied in. Check and adjust the figures.";render();return}
 if(g("data-restore")){try{var o=JSON.parse(val("bk"));["inv","inc","lia"].forEach(function(k){if(!Array.isArray(o[k]))throw 0});["tx","sips"].forEach(function(k){if(!Array.isArray(o[k]))o[k]=[]});if(!o.itr)o.itr={};if(!o.plan)o.plan={};D=o;save();ok="Restored.";err=""}catch(e){err="That text is not a valid backup."}render();return}
 if(g("data-wipe")){D=blank();save();ok="Everything erased.";render();return}});
document.addEventListener("keydown",function(e){if(e.key=="Escape"&&dr){dr=null;render()}
 if(e.key=="Enter"&&e.target.className==""&&e.target.getAttribute&&e.target.getAttribute("data-go")){page=e.target.getAttribute("data-go");render()}});
document.addEventListener("input",function(e){var t=e.target;
 if(t.id=="s_q"||t.id=="s_val"){sF[t.id.slice(2)]=t.value;var p2=t.selectionStart,id2=t.id;render();
  var e2=document.getElementById(id2);if(e2){e2.focus();try{e2.setSelectionRange(p2,p2)}catch(x){}}return}
 if(t.id=="n_q"){nQ=t.value;var pos=t.selectionStart;render();var n=document.getElementById("n_q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}});
document.addEventListener("change",function(e){var t=e.target;

 if(/^s_(theme|metric|dir|val|off|vol|own)$/.test(t.id)){sF[t.id.slice(2)]=t.value;sF.note="";render();return}
 if(t.id=="n_small"){nSmall=t.checked;render();return}
 if(t.id=="filt"){filt=t.value;sub="All";render();return}
 if(t.id=="sub"){sub=t.value;render();return}
 if(t.id=="fy"){fy=+t.value;render();return}
 if(t.id=="slab"){slab=parseInt(t.value,10);render();return}
 if(t.id=="t_kind"&&dr){dr.kind=t.value;dr.gone=false;render();return}
 if(t.id=="t_item"&&dr){var g2=(t.value=="gone");if(g2!=dr.gone){dr.gone=g2;render()}return}
 if(t.id=="t_apply"&&dr){dr.apply=t.value;return}
 if(/^sd[0-9]+$/.test(t.id)){var dd=dueSips(),xx=dd[+t.id.slice(2)];if(xx){sipDate[xx.r.name+"|"+xx.iso]=t.value;render()}return}
 if(/^i_/.test(t.id)){D.itr[t.id.slice(2)]=t.value===""?"":num(t.value);save();return}
 if(/^p_/.test(t.id)){D.plan[t.id.slice(2)]=num(t.value);save();render();return}
 if(/^tp[0-9]+$/.test(t.id)){var L3=(D.plan.trips||TRIPS).map(function(x){return{name:x.name,per:x.per,note:x.note}});
  L3[+t.id.slice(2)].per=num(t.value);D.plan.trips=L3;save();render();return}
 if(t.id=="casf"&&t.files[0]){casFile=t.files[0];casName=casFile.name;cas=null;err="";render();return}
 if(t.id=="dcf"&&t.files[0]){dcFile=t.files[0];dcName=dcFile.name;DC=null;err="";render();return}
 if(t.id=="shf"&&t.files[0]){readSheet(t.files[0]);return}});
render();

loadNews();
